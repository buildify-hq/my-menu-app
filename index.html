<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// Firebase Config (तुमचा कोड)
const firebaseConfig = {
  apiKey: "AIzaSyDL_AyEqlAZr7mafIN3J5AMV2n3uShEeW8",
  authDomain: "menu-qr-b8765.firebaseapp.com",
  projectId: "menu-qr-b8765",
  storageBucket: "menu-qr-b8765.firebasestorage.app",
  messagingSenderId: "71280897038",
  appId: "1:71280897038:web:180294fd94d32e6f11205f",
  measurementId: "G-TNKM262EVG"
};

let app = null, db = null, isFB = false;
try {
  app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  isFB = true;
} catch (e) { console.warn("FB offline:", e); }

const DEFAULT_RESTAURANTS = [
  { id: "rest-101", name: "Sagar's Cafe", tagline: "Fresh Brews & Bites", ownerPin: "111111", kitchenPin: "222222", subscriptionStatus: "ACTIVE", dueDate: new Date(Date.now() + 30 * 864e5).toISOString().split("T")[0], isMenuActive: true, isOrdersActive: true },
  { id: "rest-102", name: "Spice Craft Bistro", tagline: "Modern Fusion", ownerPin: "333333", kitchenPin: "444444", subscriptionStatus: "EXPIRED", dueDate: new Date(Date.now() - 3 * 864e5).toISOString().split("T")[0], isMenuActive: true, isOrdersActive: true }
];

const daysLeft = (d) => { if(!d) return 0; return Math.ceil((new Date(d).getTime() - Date.now()) / 864e5); };
const formatTime = (seconds) => {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
};

// Web Audio API for Kitchen Alert
const playBeep = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.25);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.25 + 0.4);
      osc.start(ctx.currentTime + i * 0.25);
      osc.stop(ctx.currentTime + i * 0.25 + 0.4);
    });
  } catch (e) {}
};

// Helper for Image Compression
const compressImage = (file, maxSize = 200) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        const ratio = Math.min(maxSize / w, maxSize / h);
        w *= ratio; h *= ratio;
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.5));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

function App() {
  const qp = new URLSearchParams(window.location.search);
  const urlRestId = qp.get("restId") || "rest-101";
  const urlTable = parseInt(qp.get("table") || "5", 10);
  const isStaffRoute = window.location.pathname.toLowerCase().endsWith("/staff") || qp.get("staff") === "true";

  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [view, setView] = useState(isStaffRoute ? "login" : "customer");

  useEffect(() => {
    if (!isFB) return;
    const unsub = db.collection("restaurants").onSnapshot((snap) => {
      if (!snap.empty) {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        setRestaurants(prev => {
          const map = new Map();
          DEFAULT_RESTAURANTS.forEach(r => map.set(r.id, r));
          prev.forEach(r => map.set(r.id, r));
          list.forEach(r => map.set(r.id, { ...map.get(r.id), ...r }));
          return Array.from(map.values());
        });
      }
    });
    return () => unsub();
  }, []);

  const currentRestaurant = useMemo(() => 
    restaurants.find(r => r.id === currentRestId) || restaurants[0], 
  [restaurants, currentRestId]);

  return (
    <div className="font-sans antialiased text-stone-900 bg-stone-50 min-h-screen">
      {view === "customer" && <CustomerView restaurant={currentRestaurant} table={urlTable} />}
      {view === "login" && (
        <PinLogin 
          restaurants={restaurants} 
          defaultRestId={currentRestId}
          onSuccess={(role, restId) => {
            setCurrentRestId(restId || currentRestId);
            setView(role);
          }} 
          onCancel={() => setView("customer")} 
        />
      )}
      {view === "owner" && <OwnerDashboard restaurant={currentRestaurant} onLogout={() => setView("customer")} />}
      {view === "kitchen" && <KitchenDashboard restaurant={currentRestaurant} onLogout={() => setView("customer")} />}
      {view === "admin" && <AdminDashboard restaurants={restaurants} setRestaurants={setRestaurants} onLogout={() => setView("customer")} />}
    </div>
  );
}

// ================= 1. CUSTOMER VIEW =================
function CustomerView({ restaurant, table }) {
  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [cat, setCat] = useState("All");
  const [search, setSearch] = useState("");
  const [pureVeg, setPureVeg] = useState(false);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [notes, setNotes] = useState("");
  const [activeOrder, setActiveOrder] = useState(null);
  const [placedOrder, setPlacedOrder] = useState(null);
  const [showRating, setShowRating] = useState(false);
  const [rating, setRating] = useState(5);

  useEffect(() => {
    if (!isFB) return;
    const unsub = db.collection("restaurants").doc(restaurant.id).collection("menuItems").onSnapshot(s => {
      setMenu(s.docs.map(d => ({ id: d.id, available: true, ...d.data() })));
    });
    return () => unsub();
  }, [restaurant.id]);

  useEffect(() => {
    if (!isFB) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const unsub = db.collection("restaurants").doc(restaurant.id).collection("orders")
      .where("timestamp", ">=", today.getTime())
      .onSnapshot(s => {
        const orders = s.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(o => String(o.tableNumber) === String(table) && o.status !== "COMPLETED")
          .sort((a,b) => b.timestamp - a.timestamp);
        setActiveOrder(orders[0] || null);
      });
    return () => unsub();
  }, [restaurant.id, table]);

  const filtered = menu.filter(m => {
    if (!m.available) return false;
    if (pureVeg && !m.isVegetarian) return false;
    if (cat === "Veg" && !m.isVegetarian) return false;
    if (cat === "Non-Veg" && m.isVegetarian) return false;
    if (cat !== "All" && cat !== "Veg" && cat !== "Non-Veg" && m.category !== cat) return false;
    if (search && !m.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const tax = subtotal * 0.05;
  const total = subtotal + tax;
  const itemCount = cart.reduce((s, i) => s + i.qty, 0);

  const handleAdd = (item) => {
    setCart(p => {
      const ex = p.find(i => i.id === item.id);
      if (ex) return p.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
      return [...p, { ...item, qty: 1 }];
    });
  };
  const handleQty = (id, d) => setCart(p => p.map(i => i.id === id ? { ...i, qty: i.qty + d } : i).filter(i => i.qty > 0));

  const placeOrder = async () => {
    if (cart.length === 0 || restaurant.isOrdersActive === false) return;
    const token = "TB-" + Math.floor(100 + Math.random() * 900);
    const payload = {
      tokenNumber: token, tableNumber: table, items: cart, totalAmount: total, 
      status: "PENDING", specialInstructions: notes.trim(), createdAt: new Date().toISOString(), timestamp: Date.now()
    };
    if (isFB) await db.collection("restaurants").doc(restaurant.id).collection("orders").add(payload);
    setPlacedOrder(payload); setCart([]); setIsCartOpen(false); setShowRating(true);
  };

  const submitRating = async () => {
    if (placedOrder && isFB) {
      await db.collection("restaurants").doc(restaurant.id).collection("orders").add({
        ...placedOrder, status: "COMPLETED", rating: rating, isFeedback: true, timestamp: Date.now()
      });
    }
    setShowRating(false); setPlacedOrder(null);
  };

  return (
    <div className="min-h-screen bg-stone-50 pb-28">
      {/* Header */}
      <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-amber-600 text-white flex items-center justify-center font-black text-lg">
              {restaurant.name.charAt(0)}
            </div>
            <div>
              <h1 className="font-black text-base text-stone-900 leading-tight">{restaurant.name}</h1>
              <div className="flex items-center gap-2 text-xs text-stone-500 mt-0.5">
                <span className="font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">Table {table}</span>
              </div>
            </div>
          </div>
          <button onClick={() => window.location.href = "/?staff=true"} className="text-xs font-bold text-stone-500 bg-stone-100 px-3 py-1.5 rounded-lg">Staff Login</button>
        </div>
      </header>

      {/* Live Tracker */}
      {activeOrder && (
        <div className="max-w-4xl mx-auto px-4 pt-4">
          <div className="bg-stone-900 text-white rounded-3xl p-4 flex justify-between items-center shadow-lg">
            <div className="flex items-center gap-3">
              <span className="text-2xl">📡</span>
              <div>
                <p className="text-[10px] font-black uppercase text-amber-400">{activeOrder.tokenNumber} • Table {activeOrder.tableNumber}</p>
                <p className="text-sm font-black">
                  {activeOrder.status === "PENDING" ? "🔴 Pending (Kitchen)" : activeOrder.status === "PREPARING" ? "🟡 Cooking..." : "🟢 Ready to Serve"}
                </p>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Filters */}
      <div className="max-w-4xl mx-auto px-4 pt-6 space-y-3">
        <div className="flex gap-2 items-center">
          <input 
            type="text" placeholder="Search dishes..." value={search} onChange={e => setSearch(e.target.value)}
            className="w-full px-4 py-2.5 bg-white border border-stone-200 rounded-2xl text-xs focus:ring-2 focus:ring-amber-500 outline-none"
          />
          <label className="flex items-center gap-1.5 bg-white border border-stone-200 rounded-xl px-3 py-2 cursor-pointer shrink-0">
            <input type="checkbox" checked={pureVeg} onChange={e => setPureVeg(e.target.checked)} className="w-4 h-4 accent-emerald-600" />
            <span className="text-xs font-bold text-emerald-700">Pure Veg</span>
          </label>
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
          {["All", "Veg", "Non-Veg", "Mains", "Snacks", "Drinks"].map(c => (
            <button key={c} onClick={() => setCat(c)} className={`px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${cat === c ? "bg-stone-900 text-white" : "bg-white border border-stone-200 text-stone-700"}`}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {/* Menu Items */}
      <div className="max-w-4xl mx-auto px-4 mt-4">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const qty = cart.find(c => c.id === item.id)?.qty || 0;
            return (
              <div key={item.id} className="bg-white rounded-3xl p-3 border border-stone-200 shadow-sm flex gap-4 items-center">
                <img src={item.image || "https://images.unsplash.com/photo-1546833999-b9f581a1996d"} className="w-24 h-24 rounded-2xl object-cover" />
                <div className="flex-1 flex flex-col justify-between h-full py-1">
                  <div>
                    <h3 className="font-black text-sm text-stone-900">{item.name}</h3>
                    <p className="text-xs font-bold text-amber-700 mt-1">₹{item.price}</p>
                    <p className="text-[10px] text-stone-500 line-clamp-1">{item.description}</p>
                  </div>
                  <div className="flex justify-end mt-2">
                    {qty > 0 ? (
                      <div className="flex items-center gap-2 bg-stone-50 border rounded-xl p-1">
                        <button onClick={() => handleQty(item.id, -1)} className="w-7 h-7 bg-white rounded-lg font-black shadow-sm">−</button>
                        <span className="font-black text-xs w-4 text-center">{qty}</span>
                        <button onClick={() => handleQty(item.id, 1)} className="w-7 h-7 bg-amber-600 text-white rounded-lg font-black shadow-sm">+</button>
                      </div>
                    ) : (
                      <button onClick={() => handleAdd(item)} className="px-4 py-1.5 bg-stone-100 text-stone-900 rounded-xl text-xs font-bold">+ Add</button>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Cart Bar */}
      {itemCount > 0 && (
        <div className="fixed bottom-4 left-4 right-4 max-w-xl mx-auto z-40">
          <div onClick={() => setIsCartOpen(true)} className="bg-stone-900 text-white rounded-2xl p-4 flex justify-between items-center cursor-pointer shadow-2xl">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-amber-600 flex items-center justify-center font-black">{itemCount}</div>
              <div>
                <p className="font-bold text-xs uppercase tracking-wider text-stone-300">View Cart</p>
                <p className="font-black font-mono text-sm">₹{total.toFixed(2)}</p>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Cart Sheet */}
      {isCartOpen && (
        <div className="fixed inset-0 z-50 bg-black/60 flex justify-end">
          <div className="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
            <div>
              <div className="flex justify-between items-center pb-3 border-b mb-4">
                <h2 className="font-black text-lg">Your Order</h2>
                <button onClick={() => setIsCartOpen(false)} className="text-stone-500 text-sm font-bold">✕</button>
              </div>
              {cart.map(item => (
                <div key={item.id} className="flex justify-between items-center bg-stone-50 p-3 rounded-xl mb-2">
                  <div>
                    <p className="font-bold text-sm">{item.name}</p>
                    <p className="font-mono text-xs text-stone-500">₹{item.price} x {item.qty}</p>
                  </div>
                  <div className="flex items-center gap-2 bg-white border rounded-lg p-1">
                    <button onClick={() => handleQty(item.id, -1)} className="w-6 h-6 font-black">−</button>
                    <span className="text-xs font-bold">{item.qty}</span>
                    <button onClick={() => handleQty(item.id, 1)} className="w-6 h-6 font-black">+</button>
                  </div>
                </div>
              ))}
              <textarea rows="2" placeholder="Special Instructions..." value={notes} onChange={e => setNotes(e.target.value)} className="w-full bg-stone-50 border rounded-xl p-3 text-xs mt-3 outline-none" />
            </div>
            <div className="border-t pt-4">
              <div className="flex justify-between text-xs mb-1 text-stone-500"><span>Subtotal</span><span>₹{subtotal.toFixed(2)}</span></div>
              <div className="flex justify-between text-xs mb-3 text-stone-500"><span>GST (5%)</span><span>₹{tax.toFixed(2)}</span></div>
              <div className="flex justify-between font-black text-lg mb-4"><span>Total</span><span className="text-amber-700">₹{total.toFixed(2)}</span></div>
              <button onClick={placeOrder} className="w-full py-4 bg-amber-600 text-white font-black rounded-xl text-sm">Place Order</button>
            </div>
          </div>
        </div>
      )}

      {/* Rating Modal */}
      {showRating && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 w-full max-w-xs text-center space-y-4">
            <h2 className="font-black text-lg">Rate Your Experience</h2>
            <div className="flex justify-center gap-2 text-3xl">
              {[1,2,3,4,5].map(s => <button key={s} onClick={() => setRating(s)} className={rating >= s ? "text-amber-500" : "text-stone-300"}>★</button>)}
            </div>
            <button onClick={submitRating} className="w-full py-3 bg-amber-600 text-white rounded-xl font-bold text-sm">Submit Rating</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= 2. KITCHEN VIEW (Light Mode) =================
function KitchenDashboard({ restaurant, onLogout }) {
  const [orders, setOrders] = useState([]);
  const [now, setNow] = useState(Date.now());
  const prevIds = useRef(new Set());

  useEffect(() => {
    const iv = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (!isFB) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const unsub = db.collection("restaurants").doc(restaurant.id).collection("orders")
      .where("timestamp", ">=", today.getTime())
      .onSnapshot(s => {
        const list = s.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(o => !["COMPLETED", "CANCELLED"].includes(o.status))
          .sort((a,b) => a.timestamp - b.timestamp);
        
        setOrders(list);
        const pendingIds = new Set(list.filter(o => o.status === "PENDING").map(o => o.id));
        let hasNew = false;
        pendingIds.forEach(id => { if (!prevIds.current.has(id)) hasNew = true; });
        if (hasNew && prevIds.current.size > 0) playBeep();
        prevIds.current = pendingIds;
      });
    return () => unsub();
  }, [restaurant.id]);

  const updateStatus = async (id, status) => {
    await db.collection("restaurants").doc(restaurant.id).collection("orders").doc(id).update({ status });
  };

  const cols = [
    { key: "PENDING", title: "New Orders", bg: "bg-red-50", border: "border-red-200", btn: "Start Cooking", next: "PREPARING" },
    { key: "PREPARING", title: "Cooking", bg: "bg-amber-50", border: "border-amber-200", btn: "Mark Ready", next: "READY" },
    { key: "READY", title: "Ready to Serve", bg: "bg-emerald-50", border: "border-emerald-200", btn: "Complete", next: "COMPLETED" }
  ];

  return (
    <div className="min-h-screen bg-stone-100 p-4">
      <header className="flex justify-between items-center pb-4 border-b mb-4">
        <div>
          <h1 className="text-xl font-black text-stone-900">Kitchen Display</h1>
          <p className="text-xs text-stone-500">{restaurant.name}</p>
        </div>
        <button onClick={onLogout} className="px-3 py-1.5 bg-white border text-xs font-bold rounded-lg shadow-sm">Exit</button>
      </header>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {cols.map(col => {
          const list = orders.filter(o => o.status === col.key);
          return (
            <div key={col.key} className={`rounded-2xl p-3 border ${col.bg} ${col.border} min-h-[500px]`}>
              <h2 className="font-black text-sm text-stone-800 mb-3">{col.title} ({list.length})</h2>
              <div className="space-y-3">
                {list.map(o => {
                  const elapsed = Math.floor((now - o.timestamp) / 1000);
                  return (
                    <div key={o.id} className="bg-white rounded-xl p-4 shadow-sm border border-stone-200">
                      <div className="flex justify-between items-center mb-2">
                        <span className="font-black font-mono text-amber-700 text-sm">{o.tokenNumber}</span>
                        <span className="text-xs font-bold bg-stone-100 px-2 py-0.5 rounded">T-{o.tableNumber}</span>
                      </div>
                      <div className="text-xs text-stone-600 mb-2 font-mono">⏱ {formatTime(elapsed)}</div>
                      <div className="space-y-1 mb-3">
                        {o.items.map((i, idx) => (
                          <div key={idx} className="flex justify-between text-xs font-medium">
                            <span>{i.qty}x {i.name}</span>
                          </div>
                        ))}
                      </div>
                      {o.specialInstructions && <div className="text-[10px] bg-amber-50 text-amber-800 p-2 rounded mb-3">⚠️ {o.specialInstructions}</div>}
                      <button onClick={() => updateStatus(o.id, col.next)} className="w-full py-2 bg-stone-900 text-white font-bold text-xs rounded-lg">{col.btn}</button>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ================= 3. OWNER VIEW =================
function OwnerDashboard({ restaurant, onLogout }) {
  const [tab, setTab] = useState("menu");
  const [menu, setMenu] = useState([]);
  const [orders, setOrders] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({ name: "", price: "", category: "Mains", type: "Veg", image: "", description: "" });
  
  const [isMenuActive, setIsMenuActive] = useState(restaurant.isMenuActive !== false);
  const [isOrdersActive, setIsOrdersActive] = useState(restaurant.isOrdersActive !== false);

  useEffect(() => {
    if (!isFB) return;
    const unsubMenu = db.collection("restaurants").doc(restaurant.id).collection("menuItems").onSnapshot(s => setMenu(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    
    const today = new Date(); today.setHours(0,0,0,0);
    const unsubOrders = db.collection("restaurants").doc(restaurant.id).collection("orders")
      .where("timestamp", ">=", today.getTime())
      .onSnapshot(s => setOrders(s.docs.map(d => ({ id: d.id, ...d.data() }))));
      
    return () => { unsubMenu(); unsubOrders(); };
  }, [restaurant.id]);

  const toggleMenu = async () => {
    setIsMenuActive(!isMenuActive);
    await db.collection("restaurants").doc(restaurant.id).update({ isMenuActive: !isMenuActive });
  };
  const toggleOrders = async () => {
    setIsOrdersActive(!isOrdersActive);
    await db.collection("restaurants").doc(restaurant.id).update({ isOrdersActive: !isOrdersActive });
  };

  const saveDish = async (e) => {
    e.preventDefault();
    const data = { ...form, price: parseFloat(form.price), isVegetarian: form.type === "Veg", available: true };
    if (editItem) {
      await db.collection("restaurants").doc(restaurant.id).collection("menuItems").doc(editItem.id).update(data);
    } else {
      await db.collection("restaurants").doc(restaurant.id).collection("menuItems").add(data);
    }
    setShowAdd(false); setEditItem(null); setForm({ name: "", price: "", category: "Mains", type: "Veg", image: "", description: "" });
  };

  const deleteDish = async (id) => {
    if(window.confirm("Delete this dish?")) await db.collection("restaurants").doc(restaurant.id).collection("menuItems").doc(id).delete();
  };

  const exportExcel = () => {
    const ws = XLSX.utils.json_to_sheet(orders.map(o => ({ Token: o.tokenNumber, Table: o.tableNumber, Items: o.items.map(i=>i.name).join(', '), Total: o.totalAmount, Status: o.status })));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Orders");
    XLSX.writeFile(wb, "Sales_Report.xlsx");
  };

  return (
    <div className="min-h-screen bg-stone-50 p-4 pb-20">
      <header className="flex justify-between items-center pb-4 border-b mb-4">
        <div>
          <h1 className="text-xl font-black">{restaurant.name}</h1>
          <p className="text-xs font-bold text-stone-500 uppercase">Owner Dashboard</p>
        </div>
        <button onClick={onLogout} className="px-3 py-1.5 bg-stone-100 font-bold text-xs rounded-lg">Exit</button>
      </header>

      <div className="flex gap-2 mb-6 overflow-x-auto no-scrollbar">
        {["menu", "orders", "reports", "settings"].map(t => (
          <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-xs font-bold capitalize ${tab === t ? "bg-amber-600 text-white" : "bg-white border text-stone-600"}`}>{t}</button>
        ))}
      </div>

      {tab === "menu" && (
        <div>
          <div className="flex justify-between items-center mb-4">
            <h2 className="font-black text-lg">Menu ({menu.length})</h2>
            <button onClick={() => { setEditItem(null); setShowAdd(true); }} className="px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-bold">+ Add Dish</button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {menu.map(item => (
              <div key={item.id} className="bg-white p-3 rounded-2xl border flex justify-between items-center shadow-sm">
                <div className="flex items-center gap-3">
                  <img src={item.image || "https://images.unsplash.com/photo-1546833999-b9f581a1996d"} className="w-12 h-12 rounded-lg object-cover" />
                  <div>
                    <p className="font-bold text-sm">{item.name}</p>
                    <p className="text-xs text-amber-700 font-bold">₹{item.price}</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => { setForm(item); setEditItem(item); setShowAdd(true); }} className="p-1.5 bg-stone-100 rounded-lg">✏️</button>
                  <button onClick={() => deleteDish(item.id)} className="p-1.5 bg-red-50 text-red-600 rounded-lg">🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === "orders" && (
        <div className="space-y-3">
          <h2 className="font-black text-lg mb-2">Live Orders</h2>
          {orders.map(o => (
            <div key={o.id} className="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
              <div>
                <p className="font-black text-sm text-amber-700">{o.tokenNumber}</p>
                <p className="text-xs text-stone-600">Table {o.tableNumber} • ₹{o.totalAmount}</p>
              </div>
              <span className="px-2 py-1 bg-stone-100 text-xs font-bold rounded-lg">{o.status}</span>
            </div>
          ))}
        </div>
      )}

      {tab === "reports" && (
        <div className="space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <div className="bg-white p-4 rounded-xl border"><p className="text-xs font-bold text-stone-500">Total Revenue</p><p className="text-2xl font-black text-amber-700">₹{orders.reduce((s,o)=>s+o.totalAmount,0)}</p></div>
            <div className="bg-white p-4 rounded-xl border"><p className="text-xs font-bold text-stone-500">Total Orders</p><p className="text-2xl font-black">{orders.length}</p></div>
          </div>
          <button onClick={exportExcel} className="w-full py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl">📥 Export to Excel</button>
        </div>
      )}

      {tab === "settings" && (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-2xl border flex justify-between items-center">
            <span className="font-bold text-sm">Menu Visible</span>
            <button onClick={toggleMenu} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${isMenuActive ? "bg-emerald-600 text-white" : "bg-stone-300"}`}>{isMenuActive ? "ON" : "OFF"}</button>
          </div>
          <div className="bg-white p-4 rounded-2xl border flex justify-between items-center">
            <span className="font-bold text-sm">Accepting Orders</span>
            <button onClick={toggleOrders} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${isOrdersActive ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"}`}>{isOrdersActive ? "ON" : "PAUSED"}</button>
          </div>
        </div>
      )}

      {/* Add/Edit Modal */}
      {showAdd && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
          <form onSubmit={saveDish} className="bg-white rounded-2xl p-5 w-full max-w-sm space-y-3">
            <h3 className="font-black text-lg">{editItem ? "Edit" : "Add"} Dish</h3>
            <input type="text" placeholder="Name" required value={form.name} onChange={e=>setForm({...form, name: e.target.value})} className="w-full border p-2 rounded-xl text-sm" />
            <input type="number" placeholder="Price" required value={form.price} onChange={e=>setForm({...form, price: e.target.value})} className="w-full border p-2 rounded-xl text-sm" />
            <textarea placeholder="Description" value={form.description} onChange={e=>setForm({...form, description: e.target.value})} className="w-full border p-2 rounded-xl text-sm" />
            <input type="text" placeholder="Image URL" value={form.image} onChange={e=>setForm({...form, image: e.target.value})} className="w-full border p-2 rounded-xl text-sm" />
            <div className="flex gap-2">
              <select value={form.type} onChange={e=>setForm({...form, type: e.target.value})} className="flex-1 border p-2 rounded-xl text-sm"><option>Veg</option><option>Non-Veg</option></select>
              <select value={form.category} onChange={e=>setForm({...form, category: e.target.value})} className="flex-1 border p-2 rounded-xl text-sm"><option>Mains</option><option>Snacks</option><option>Drinks</option></select>
            </div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={()=>setShowAdd(false)} className="flex-1 py-2 bg-stone-100 rounded-xl text-xs font-bold">Cancel</button>
              <button type="submit" className="flex-1 py-2 bg-amber-600 text-white rounded-xl text-xs font-bold">Save</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ================= 4. SUPER ADMIN VIEW =================
function AdminDashboard({ restaurants, setRestaurants, onLogout }) {
  const [name, setName] = useState("");
  
  const createRest = async (e) => {
    e.preventDefault();
    if (!name) return;
    const oPin = Math.floor(100000 + Math.random() * 900000).toString();
    const kPin = Math.floor(100000 + Math.random() * 900000).toString();
    const payload = {
      name, ownerPin: oPin, kitchenPin: kPin,
      subscriptionStatus: "ACTIVE", dueDate: new Date(Date.now() + 30*864e5).toISOString().split("T")[0],
      isMenuActive: true, isOrdersActive: true
    };
    if (isFB) {
      const ref = await db.collection("restaurants").add(payload);
      setRestaurants(prev => [{ id: ref.id, ...payload }, ...prev]);
    }
    setName("");
    alert(`Restaurant Created!\nOwner PIN: ${oPin}\nKitchen PIN: ${kPin}`);
  };

  const renew = async (id) => {
    const newDate = new Date(Date.now() + 30*864e5).toISOString().split("T")[0];
    await db.collection("restaurants").doc(id).update({ subscriptionStatus: "ACTIVE", dueDate: newDate });
  };

  return (
    <div className="min-h-screen bg-stone-100 p-4">
      <header className="flex justify-between items-center pb-4 border-b mb-6">
        <h1 className="text-xl font-black text-purple-700">Super Admin</h1>
        <button onClick={onLogout} className="px-3 py-1.5 bg-white border font-bold text-xs rounded-lg">Exit</button>
      </header>

      <form onSubmit={createRest} className="bg-white p-4 rounded-2xl border mb-6 max-w-md space-y-3">
        <h2 className="font-black text-sm">Create New Restaurant</h2>
        <input type="text" placeholder="Restaurant Name" required value={name} onChange={e => setName(e.target.value)} className="w-full border p-2 rounded-xl text-sm" />
        <button type="submit" className="w-full py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">Create & Generate PINs</button>
      </form>

      <div className="space-y-3 max-w-md">
        {restaurants.map(r => (
          <div key={r.id} className="bg-white p-4 rounded-xl border shadow-sm space-y-2">
            <div className="flex justify-between items-center">
              <p className="font-bold">{r.name}</p>
              <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${r.subscriptionStatus === "ACTIVE" ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}`}>{r.subscriptionStatus}</span>
            </div>
            <p className="text-xs text-stone-500 font-mono">Owner: {r.ownerPin} | Kitchen: {r.kitchenPin}</p>
            <div className="flex gap-2 pt-2">
              <button onClick={() => renew(r.id)} className="px-3 py-1 bg-indigo-600 text-white text-xs font-bold rounded-lg">+30 Days</button>
              <a href={`/?restId=${r.id}&table=1`} target="_blank" className="px-3 py-1 bg-stone-100 text-xs font-bold rounded-lg">Open Menu</a>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ================= 5. PIN LOGIN =================
function PinLogin({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const handleVerify = () => {
    if (pin === "999999") return onSuccess("admin");
    const rest = restaurants.find(r => r.id === defaultRestId);
    if (rest?.ownerPin === pin) return onSuccess("owner", rest.id);
    if (rest?.kitchenPin === pin) return onSuccess("kitchen", rest.id);
    
    const anyOwner = restaurants.find(r => r.ownerPin === pin);
    if (anyOwner) return onSuccess("owner", anyOwner.id);
    const anyKitchen = restaurants.find(r => r.kitchenPin === pin);
    if (anyKitchen) return onSuccess("kitchen", anyKitchen.id);

    setError("Invalid PIN"); setPin("");
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl p-6 w-full max-w-xs text-center space-y-4">
        <h2 className="font-black text-lg">Staff Access</h2>
        <p className="text-xs text-stone-500">Enter 6-digit PIN</p>
        <div className="flex justify-center gap-2">
          {[0,1,2,3,4,5].map(i => <div key={i} className={`w-9 h-11 rounded-xl border flex items-center justify-center font-bold ${pin[i] ? "border-amber-500 bg-amber-50" : "border-stone-200"}`}>{pin[i] ? "•" : ""}</div>)}
        </div>
        {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
        <div className="grid grid-cols-3 gap-2">
          {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={() => pin.length < 6 && setPin(pin + n)} className="py-3 bg-stone-50 rounded-xl font-bold text-lg">{n}</button>)}
          <button onClick={() => setPin("")} className="py-3 bg-stone-50 rounded-xl text-xs text-stone-500 font-bold">Clear</button>
          <button onClick={() => pin.length < 6 && setPin(pin + "0")} className="py-3 bg-stone-50 rounded-xl font-bold text-lg">0</button>
          <button onClick={() => setPin(pin.slice(0, -1))} className="py-3 bg-stone-50 rounded-xl font-bold">⌫</button>
        </div>
        <button onClick={handleVerify} disabled={pin.length < 6} className="w-full py-3 bg-amber-600 text-white rounded-xl font-bold text-sm disabled:bg-stone-300">Verify</button>
        <button onClick={onCancel} className="text-xs text-stone-400 font-bold pt-2">Cancel</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
