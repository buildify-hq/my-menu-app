  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [blockTimer, setBlockTimer] = useState(0);

  useEffect(() => {

  }, []);

// SUPER ADMIN
function AdminView({ restaurants, onRenew, onAdd, onLogout, setRestaurants }) {
  const [name, setName] = useState("");
  const [loading, setLoading] = useState(false);
  const [clearing, setClearing] = useState(false);
  
  const [editNameModal, setEditNameModal] = useState(null);
  const [editDateModal, setEditDateModal] = useState(null);
  const [pinModal, setPinModal] = useState(null);
  const [deleteModal, setDeleteModal] = useState(null);

  const generate = async (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    setLoading(true);
    const ownerPin = String(Math.floor(100000 + Math.random() * 900000));
    let kitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    while (kitchenPin === ownerPin) kitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    const payload = { name: name.trim(), ownerPin, kitchenPin, subscriptionStatus: "ACTIVE", dueDate: new Date(Date.now() + 30*864e5).toISOString().split("T")[0], isMenuActive: true, isOrdersActive: true, themeColor: "#d97706", upiId: "", taxRate: 5, taxIncluded: false, showTax: true };
    try {
      const ref = await db.collection("restaurants").add(payload);
      onAdd({ id: ref.id, ...payload });
      setPinModal({ id: ref.id, name: name.trim(), ownerPin, kitchenPin });
      setName("");
    } catch (e) { alert("Error: " + e.message); }
    setLoading(false);
  };

  const clearRestaurantData = async (r) => {
    if (!window.confirm(`Download backup and PERMANENTLY delete ALL orders for ${r.name}?`)) return;
    setClearing(true);
    try {
      const snap = await db.collection("restaurants").doc(r.id).collection("orders").get();
      if (snap.empty) { alert("No orders found."); setClearing(false); return; }
      const allOrders = snap.docs.map(d => parseOrder(d.id, d.data()));
      const ws = XLSX.utils.json_to_sheet(allOrders.map(o => ({ Date: o.createdAt, Token: o.tokenNumber, Table: o.tableNumber, Items: o.items.map(i => i.qty + "x " + i.name).join("; "), Total: o.totalAmount, Status: o.status })));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Orders");
      XLSX.writeFile(wb, `Backup_${r.name}_${new Date().toISOString().split("T")[0]}.xlsx`);
      const chunks = []; for (let i = 0; i < snap.docs.length; i += 500) chunks.push(snap.docs.slice(i, i + 500));
      for (const chunk of chunks) { const batch = db.batch(); chunk.forEach(doc => batch.delete(doc.ref)); await batch.commit(); }
      alert(`✅ ${r.name} data cleared!`);
    } catch (err) { alert("Error: " + err.message); }
    setClearing(false);
  };

  const toggleStatus = async (r) => {
    const ns = r.subscriptionStatus === "ACTIVE" ? "EXPIRED" : "ACTIVE";
    setRestaurants(prev => prev.map(x => x.id === r.id ? { ...x, subscriptionStatus: ns } : x));
    if (isFB) await db.collection("restaurants").doc(r.id).update({ subscriptionStatus: ns });
  };

  const saveName = async () => {
    setRestaurants(prev => prev.map(x => x.id === editNameModal.id ? { ...x, name: editNameModal.name } : x));
    if (isFB) await db.collection("restaurants").doc(editNameModal.id).update({ name: editNameModal.name });
    setEditNameModal(null);
  };

  const saveDate = async () => {
    setRestaurants(prev => prev.map(x => x.id === editDateModal.id ? { ...x, dueDate: editDateModal.date, subscriptionStatus: "ACTIVE" } : x));
    if (isFB) await db.collection("restaurants").doc(editDateModal.id).update({ dueDate: editDateModal.date, subscriptionStatus: "ACTIVE" });
    setEditDateModal(null);
  };

  const saveCustomPin = async () => {
    setRestaurants(prev => prev.map(x => x.id === pinModal.id ? { ...x, ownerPin: pinModal.ownerPin, kitchenPin: pinModal.kitchenPin } : x));
    if (isFB) await db.collection("restaurants").doc(pinModal.id).update({ ownerPin: pinModal.ownerPin, kitchenPin: pinModal.kitchenPin });
    setPinModal(null); alert("PINs Updated!");
  };

  const delRest = async () => {
    if (!deleteModal) return;
    setRestaurants(prev => prev.filter(x => x.id !== deleteModal.id));
    if (isFB) await db.collection("restaurants").doc(deleteModal.id).delete();
    setDeleteModal(null);
  };

  return React.createElement("div", { className: "min-h-screen bg-slate-100 p-4" },
    React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-slate-300 mb-4" },
      React.createElement("h1", { className: "text-xl font-black text-purple-700" }, "Super Admin Power"),
      React.createElement("button", { onClick: onLogout, className: "text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm" }, "Exit")
    ),
    React.createElement("form", { onSubmit: generate, className: "bg-white p-5 rounded-2xl border shadow-sm space-y-3 max-w-md mb-6" },
      React.createElement("h2", { className: "font-black" }, "Create New Restaurant"),
      React.createElement("input", { type: "text", placeholder: "Restaurant Name", value: name, onChange: e => setName(e.target.value), className: "w-full border p-3 rounded-xl text-sm", required: true }),
      React.createElement("button", { type: "submit", disabled: loading, className: "w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-sm" }, loading ? "Creating..." : "Create & Generate PINs")
    ),
    React.createElement("div", { className: "space-y-4 max-w-md pb-10" },
      React.createElement("h2", { className: "font-black text-sm text-slate-500 uppercase" }, "All Restaurants"),
      restaurants.map(r => {
        const isActive = r.subscriptionStatus === "ACTIVE";
        const days = daysLeft(r.dueDate);
        return React.createElement("div", { key: r.id, className: "bg-white p-4 rounded-2xl border shadow-sm space-y-3" },
          React.createElement("div", { className: "flex justify-between items-start" },
            React.createElement("div", null,
              React.createElement("p", { className: "font-black text-lg text-slate-900" }, r.name),
              React.createElement("div", { className: "flex gap-2 mt-1" },
                React.createElement("p", { className: "text-[10px] font-mono bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded border border-amber-100" }, "O: " + r.ownerPin),
                React.createElement("p", { className: "text-[10px] font-mono bg-blue-50 text-blue-800 px-1.5 py-0.5 rounded border border-blue-100" }, "K: " + r.kitchenPin)
              )
            ),
            React.createElement("span", { className: `text-[10px] px-2 py-1 rounded-lg font-black ${isActive ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}` }, r.subscriptionStatus)
          ),
          React.createElement("div", { className: "flex justify-between items-center py-2 border-y border-slate-100" },
            React.createElement("p", { className: "text-[11px] font-bold text-slate-500" }, "Expiry: " + (r.dueDate || "N/A")),
            React.createElement("p", { className: "text-[11px] font-black " + (days < 0 ? "text-red-500" : "text-slate-700") }, days + " days left")
          ),
          React.createElement("div", { className: "grid grid-cols-2 gap-2 pt-1" },
            React.createElement("button", { onClick: () => setEditNameModal({ id: r.id, name: r.name }), className: "py-2 bg-slate-100 rounded-lg text-xs font-bold text-slate-700" }, "✏️ Name"),
            React.createElement("button", { onClick: () => setEditDateModal({ id: r.id, date: r.dueDate || new Date().toISOString().split("T")[0] }), className: "py-2 bg-slate-100 rounded-lg text-xs font-bold text-slate-700" }, "📅 Date"),
            React.createElement("button", { onClick: () => setPinModal({ id: r.id, name: r.name, ownerPin: r.ownerPin, kitchenPin: r.kitchenPin }), className: "py-2 bg-amber-100 rounded-lg text-xs font-bold text-amber-700" }, "🔑 PINs"),
            React.createElement("button", { onClick: () => clearRestaurantData(r), disabled: clearing, className: "py-2 bg-rose-100 rounded-lg text-xs font-bold text-rose-700 disabled:opacity-50" }, "🗄️ Clear Data"),
            React.createElement("button", { onClick: () => onRenew(r.id), className: "py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-sm col-span-1" }, "+30 Days"),
            React.createElement("button", { onClick: () => setDeleteModal({ id: r.id, name: r.name }), className: "py-2 bg-red-600 text-white rounded-lg text-xs font-bold col-span-1" }, "🗑️ Delete")
          )
        );
      })
    ),
    editNameModal && React.createElement(Sheet, { open: true, onClose: () => setEditNameModal(null), title: "✏️ Edit Name" },
      React.createElement("div", { className: "p-6 space-y-4" },
        React.createElement("input", { type: "text", value: editNameModal.name, onChange: e => setEditNameModal({...editNameModal, name: e.target.value}), className: "w-full border p-3 rounded-xl text-sm" }),
        React.createElement("button", { onClick: saveName, className: "w-full py-3 bg-slate-900 text-white rounded-xl font-bold" }, "Save Name")
      )
    ),
    editDateModal && React.createElement(Sheet, { open: true, onClose: () => setEditDateModal(null), title: "📅 Edit Date" },
      React.createElement("div", { className: "p-6 space-y-4" },
        React.createElement("input", { type: "date", value: editDateModal.date, onChange: e => setEditDateModal({...editDateModal, date: e.target.value}), className: "w-full border p-3 rounded-xl text-sm" }),
        React.createElement("button", { onClick: saveDate, className: "w-full py-3 bg-slate-900 text-white rounded-xl font-bold" }, "Save Date")
      )
    ),
    pinModal && React.createElement(Sheet, { open: true, onClose: () => setPinModal(null), title: "🔑 Edit PINs" },
      React.createElement("div", { className: "p-6 space-y-4" },
        React.createElement("h3", { className: "font-black text-lg text-slate-800" }, pinModal.name),
        React.createElement("div", { className: "space-y-3" },
          React.createElement("div", null,
            React.createElement("label", { className: "text-xs font-bold text-slate-500 uppercase" }, "Owner PIN"),
            React.createElement("input", { type: "text", maxLength: 6, value: pinModal.ownerPin, onChange: e => setPinModal({...pinModal, ownerPin: e.target.value.replace(/\D/g, "")}), className: "w-full mt-1 border p-3 rounded-xl font-mono text-lg tracking-widest" })
          ),
          React.createElement("div", null,
            React.createElement("label", { className: "text-xs font-bold text-slate-500 uppercase" }, "Kitchen PIN"),
            React.createElement("input", { type: "text", maxLength: 6, value: pinModal.kitchenPin, onChange: e => setPinModal({...pinModal, kitchenPin: e.target.value.replace(/\D/g, "")}), className: "w-full mt-1 border p-3 rounded-xl font-mono text-lg tracking-widest" })
          )
        ),
        React.createElement("button", { onClick: saveCustomPin, className: "w-full py-3 bg-slate-900 text-white rounded-xl font-bold" }, "Save Custom PINs")
      )
    ),
    deleteModal && React.createElement(Sheet, { open: true, onClose: () => setDeleteModal(null), title: "⚠️ Delete Restaurant" },
      React.createElement("div", { className: "p-6 text-center space-y-4" },
        React.createElement("p", { className: "text-sm font-bold text-slate-700" }, "Are you sure you want to delete " + deleteModal.name + "?"),
        React.createElement("p", { className: "text-xs text-red-500" }, "All menu items and orders will be permanently lost."),
        React.createElement("button", { onClick: delRest, className: "w-full py-3 btn-danger text-sm" }, "Yes, Delete Permanently")
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
