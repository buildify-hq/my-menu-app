function PinLogin({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const { t } = useT();
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [blockTimer, setBlockTimer] = useState(0);

  useEffect(() => {
    const check = () => { const b = isBlocked(); setBlockTimer(b.blocked ? b.remaining : 0); };
    check(); const iv = setInterval(check, 500); return () => clearInterval(iv);
  }, []);

  const onDigit = (d) => { if (pin.length < 6 && blockTimer === 0) { setPin(pin + d); setError(""); } };
  const onDel = () => setPin(pin.slice(0, -1));

  const verify = async () => {
    if (isBlocked().blocked) { setError("⛔ Blocked for " + blockTimer + "s"); return; }
    if (pin === "999999") return onSuccess({ role: "admin" });
    const curr = restaurants.find((r) => r.id === defaultRestId);
    if (curr?.ownerPin === pin) return onSuccess({ role: "owner", restaurantId: curr.id });
    if (curr?.kitchenPin === pin) return onSuccess({ role: "kitchen", restaurantId: curr.id });
    if (isFB) {
      for (const r of restaurants) {
        try {
          const snap = await db.collection("restaurants").doc(r.id).collection("staff").get();
          const staff = snap.docs.find((d) => d.data().pin === pin);
          if (staff) return onSuccess({ role: staff.data().role || "kitchen", restaurantId: r.id });
        } catch(e) {}
      }
    }
    const ownerR = restaurants.find((r) => r.ownerPin === pin);
    if (ownerR) return onSuccess({ role: "owner", restaurantId: ownerR.id });
    const kitchenR = restaurants.find((r) => r.kitchenPin === pin);
    if (kitchenR) return onSuccess({ role: "kitchen", restaurantId: kitchenR.id });

    const att = recordFail();
    if (att.blockedUntil) { setError("⛔ " + MAX_ATTEMPTS + " wrong attempts. Blocked 30 sec."); setBlockTimer(30); } 
    else { setError("Invalid PIN (" + (MAX_ATTEMPTS - att.count) + " tries left)"); }
    setPin("");
  };

  return React.createElement("div", { className: "fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4" },
    React.createElement("div", { className: "glass-card rounded-[32px] p-6 w-full max-w-xs text-center space-y-5 fade-up" },
      React.createElement("div", { className: "flex justify-between items-center" },

      ),
      React.createElement("div", null,
        React.createElement("h2", { className: "text-xl font-black" }, "Staff Access"),
        React.createElement("p", { className: "text-xs text-slate-500 font-medium" }, "Enter 6-digit PIN")

      React.createElement("div", { className: "flex justify-center gap-2" },

      ),
      error && React.createElement("p", { className: "text-xs text-red-600 font-bold bg-red-50 p-2 rounded-lg" }, error),
      React.createElement("div", { className: "grid grid-cols-3 gap-3 pt-2" },

        React.createElement("button", { onClick: () => setPin(""), className: "py-3.5 rounded-2xl bg-slate-100 font-bold text-xs text-slate-600 active:scale-95" }, "Clear"),
        React.createElement("button", { onClick: () => onDigit("0"), disabled: blockTimer > 0, className: "py-3.5 rounded-2xl bg-white shadow-sm border border-slate-200 font-bold text-xl active:scale-95" }, "0"),

      ),
      React.createElement("button", { onClick: verify, disabled: pin.length < 6 || blockTimer > 0, className: "w-full py-4 btn-brand text-sm disabled:bg-slate-300 disabled:shadow-none" }, "Verify")
    )

}

      .where("timestamp", ">=", todayStart.getTime())

    return () => { unsubMenu(); unsubOrders(); };
  }, [restaurant.id]);

  const revenue = orders.filter(o => o.status === "COMPLETED").reduce((s, o) => s + o.totalAmount, 0);

    if (isFB) try { await db.collection("restaurants").doc(restaurant.id).update(branding); onUpdate(branding); alert("Saved!"); } catch(e) {}
  };

  // NEW: Download Excel & Delete from Firebase
  const downloadAndClear = async () => {
    if (!window.confirm("Download all orders as Excel and PERMANENTLY delete them from Firebase to free up space?")) return;
    setIsClearing(true);
    
    try {
      // 1. Fetch ALL orders for this restaurant
      const snap = await db.collection("restaurants").doc(restaurant.id).collection("orders").get();
      if (snap.empty) { alert("No orders to clear."); setIsClearing(false); return; }
      
      const allOrders = snap.docs.map(d => parseOrder(d.id, d.data()));
      
      // 2. Generate Excel
      const ws = XLSX.utils.json_to_sheet(allOrders.map(o => ({
        Date: o.createdAt,
        Token: o.tokenNumber,
        Table: o.tableNumber,
        Items: o.items.map(i => i.qty + "x " + i.name).join("; "),
        Total: o.totalAmount,
        Status: o.status,
        Payment: o.paymentStatus
      })));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Orders");
      XLSX.writeFile(wb, `Orders_Backup_${restaurant.name}_${new Date().toISOString().split("T")[0]}.xlsx`);
      
      // 3. Delete from Firebase in batches (Max 500 per batch)
      const chunks = [];
      for (let i = 0; i < snap.docs.length; i += 500) {
        chunks.push(snap.docs.slice(i, i + 500));
      }
      
      for (const chunk of chunks) {
        const batch = db.batch();
        chunk.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
      }
      
      alert("✅ All orders downloaded and database cleared successfully!");
    } catch (err) {
      alert("Error: " + err.message);
    }
    setIsClearing(false);
  };

  return React.createElement("div", { className: "min-h-screen bg-slate-50 pb-24" },
    React.createElement("header", { className: "bg-white border-b px-4 py-4 flex justify-between items-center sticky top-0 z-30" },
      React.createElement("div", null,
        React.createElement("h1", { className: "font-black text-xl" }, restaurant.name),
        React.createElement("p", { className: "text-xs font-bold text-slate-400 uppercase" }, "Owner Panel")
      ),
      React.createElement("button", { onClick: onLogout, className: "text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg" }, "Exit")
    ),

    React.createElement("div", { className: "max-w-4xl mx-auto p-4 space-y-4" },
      tab === "home" && React.createElement("div", { className: "space-y-4" },
        React.createElement("div", { className: "grid grid-cols-2 gap-3" },
          React.createElement("div", { className: "bg-white p-4 rounded-3xl border shadow-sm" },
            React.createElement("p", { className: "text-xs font-bold text-slate-500" }, "Today's Revenue"),
            React.createElement("p", { className: "text-2xl font-black text-brand mt-1" }, "₹" + revenue.toFixed(2))
          ),
          React.createElement("div", { className: "bg-white p-4 rounded-3xl border shadow-sm" },
            React.createElement("p", { className: "text-xs font-bold text-slate-500" }, "Active Orders"),
            React.createElement("p", { className: "text-2xl font-black mt-1" }, orders.filter(o=>o.status!=="COMPLETED").length)
          )
        ),
        React.createElement("div", { className: "bg-red-50 p-5 rounded-3xl border border-red-100 shadow-sm space-y-3" },
          React.createElement("h3", { className: "font-black text-red-600 flex items-center gap-2" }, "⚠️ Database Management"),
          React.createElement("p", { className: "text-xs text-red-800 font-medium" }, "If you don't clear old orders, your free Firebase limit will fill up. This action will download an Excel backup and permanently delete orders from Firebase."),
          React.createElement("button", { onClick: downloadAndClear, disabled: isClearing, className: "w-full py-3 btn-danger text-xs disabled:opacity-50" }, isClearing ? "Processing..." : "📥 Download Backup & Clear Database")
        )
      ),

      tab === "menu" && React.createElement("div", { className: "space-y-3" },
        menu.map(item => React.createElement("div", { key: item.id, className: "bg-white p-3 rounded-2xl border flex justify-between items-center" },
          React.createElement("div", null, React.createElement("p", { className: "font-bold text-sm" }, item.name), React.createElement("p", { className: "text-xs text-brand font-bold" }, "₹" + item.price)),
          React.createElement("button", { onClick: () => db.collection("restaurants").doc(restaurant.id).collection("menuItems").doc(item.id).update({isSoldOut: !item.isSoldOut}), className: "px-3 py-1 rounded-lg text-xs font-bold " + (item.isSoldOut ? "bg-red-100 text-red-600" : "bg-emerald-100 text-emerald-600") }, item.isSoldOut ? "Sold Out" : "In Stock")
        ))
      ),

        React.createElement("h3", { className: "font-black" }, "UPI Settings"),
        React.createElement("input", { type: "text", placeholder: "yourname@upi", value: branding.upiId, onChange: e => setBranding({...branding, upiId: e.target.value}), className: "w-full border p-3 rounded-xl text-sm" }),
        React.createElement("button", { onClick: saveBranding, className: "w-full py-3 btn-brand" }, "Save")
      )
    ),

    React.createElement("div", { className: "fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 pb-safe" },
      ["home", "menu", "settings"].map(t => React.createElement("button", { key: t, onClick: () => setTab(t), className: "flex flex-col items-center p-2 " + (tab === t ? "text-brand" : "text-slate-400") }, t.toUpperCase()))
    )
  );
}

// SUPER ADMIN (With System-wide Data Control)
function AdminView({ restaurants, onRenew, onAdd, onLogout, setRestaurants }) {
  const [name, setName] = useState("");
  const [loading, setLoading] = useState(false);
  const [clearing, setClearing] = useState(false);

  const generate = async (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    setLoading(true);
    
    const ownerPin = String(Math.floor(100000 + Math.random() * 900000));
    let kitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    while (kitchenPin === ownerPin) kitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    
    const payload = { name: name.trim(), ownerPin, kitchenPin, subscriptionStatus: "ACTIVE", dueDate: new Date(Date.now() + 30*864e5).toISOString().split("T")[0], isMenuActive: true, isOrdersActive: true, themeColor: "#d97706", upiId: "" };
    
    try {
      const ref = await db.collection("restaurants").add(payload);
      onAdd({ id: ref.id, ...payload });
      alert("Restaurant Created!\nOwner PIN: " + ownerPin + "\nKitchen PIN: " + kitchenPin);
      setName("");
    } catch (e) {
      alert("Error: " + e.message);
    }
    setLoading(false);
  };

  // ADMIN: Clear specific restaurant data
  const clearRestaurantData = async (restId, restName) => {
    if (!window.confirm(`⚠️ Force clear ALL orders for ${restName}? This will download a backup and permanently delete from Firebase.`)) return;
    setClearing(true);
    try {
      const snap = await db.collection("restaurants").doc(restId).collection("orders").get();
      if (!snap.empty) {
        const allOrders = snap.docs.map(d => parseOrder(d.id, d.data()));
        const ws = XLSX.utils.json_to_sheet(allOrders.map(o => ({
          Date: o.createdAt, Token: o.tokenNumber, Table: o.tableNumber,
          Items: o.items.map(i => i.qty + "x " + i.name).join("; "),
          Total: o.totalAmount, Status: o.status
        })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Orders");
        XLSX.writeFile(wb, `Backup_${restName}_${Date.now()}.xlsx`);

        const chunks = [];
        for (let i = 0; i < snap.docs.length; i += 500) chunks.push(snap.docs.slice(i, i + 500));
        for (const chunk of chunks) {
          const batch = db.batch();
          chunk.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
        }
        alert(`✅ ${restName} data cleared successfully!`);
      } else {
        alert("No orders found for this restaurant.");
      }
    } catch (e) { alert(e.message); }
    setClearing(false);
  };

  return React.createElement("div", { className: "min-h-screen bg-slate-100 p-4" },
    React.createElement("header", { className: "flex justify-between items-center pb-4 border-b border-slate-300 mb-4" },
      React.createElement("h1", { className: "text-xl font-black text-purple-700" }, "Super Admin"),
      React.createElement("button", { onClick: onLogout, className: "text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm" }, "Exit")
    ),
    
    React.createElement("form", { onSubmit: generate, className: "bg-white p-5 rounded-2xl border shadow-sm space-y-3 max-w-md mb-6" },
      React.createElement("h2", { className: "font-black" }, "Create Restaurant"),
      React.createElement("input", { type: "text", placeholder: "Restaurant Name", value: name, onChange: e => setName(e.target.value), className: "w-full border p-3 rounded-xl text-sm", required: true }),
      React.createElement("button", { type: "submit", disabled: loading, className: "w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-sm" }, loading ? "Creating..." : "Create New")
    ),

    React.createElement("div", { className: "space-y-3 max-w-md" },
      React.createElement("h2", { className: "font-black text-sm text-slate-500 uppercase" }, "All Restaurants"),
      restaurants.map(r => React.createElement("div", { key: r.id, className: "bg-white p-4 rounded-xl border shadow-sm flex flex-col gap-3" },
        React.createElement("div", { className: "flex justify-between items-start" },
          React.createElement("div", null,
            React.createElement("p", { className: "font-bold text-sm" }, r.name),
            React.createElement("p", { className: "text-[10px] font-mono text-slate-500 mt-1" }, "O: " + r.ownerPin + " | K: " + r.kitchenPin)
          ),
          React.createElement("span", { className: `text-[10px] px-2 py-0.5 rounded font-bold ${r.subscriptionStatus === "ACTIVE" ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}` }, r.subscriptionStatus)
        ),
        React.createElement("div", { className: "flex gap-2" },
          React.createElement("button", { onClick: () => onRenew(r.id), className: "flex-1 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold" }, "+30 Days"),
          React.createElement("button", { onClick: () => clearRestaurantData(r.id, r.name), disabled: clearing, className: "flex-1 py-2 bg-red-50 text-red-600 rounded-lg text-xs font-bold" }, "🗑️ Clear Data")
        )
      ))
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
